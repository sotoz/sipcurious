name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      # tshark and tcpdump are optional: the tests that derive their expected
      # values from them skip when the tools are missing (see AGENTS.md).
      - run: go test -race ./...
      - name: smoke test
        shell: bash
        run: |
          go run ./cmd/sipcurious calls --utc testdata/samples/basic-call.pcap
          go run ./cmd/sipcurious diagnose --fail-on error testdata/samples/basic-call.pcap
