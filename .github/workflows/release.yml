name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Same artifacts as `make dist` locally: CGO_ENABLED=0 cross-compiles for
      # linux/darwin/windows x amd64/arm64, tar.gz (zip on windows), SHA256SUMS,
      # the version stamped via -ldflags "-X main.version=<tag>".
      - name: Build artifacts
        run: make dist VERSION=${{ github.ref_name }}
      - name: Extract release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Release ${GITHUB_REF_NAME}" > release-notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist (created by hand with the same
          # artifacts); create it if missing, then (re)upload the assets.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
